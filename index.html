<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeepTrack - Universal Expiry Alarms</title>
    
    <!-- Production PWA Manifest Assets -->
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22KeepTrack%20Expiry%20Alarms%22,%22short_name%22:%22KeepTrack%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22orientation%22:%22portrait%22,%22background_color%22:%22%23111827%22,%22theme_color%22:%22%2314b8a6%22,%22description%22:%22A%20universal%20utility%20application%20helping%20users%20log%20and%20track%20the%20expiry%20dates%20of%20documents%20and%20subscriptions%20with%20custom%20alerts.%22,%22icons%22:[{%22src%22:%22https://flaticon.com}]}">
    <meta name="theme-color" content="#14b8a6">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Stylesheets & Monetization Scripts -->
    <script src="https://tailwindcss.com"></script>
    <script async src="https://googlesyndication.com" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans pb-32">

    <!-- App Header Layout -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-teal-400 tracking-wide">📅 KeepTrack</h1>
        <select id="filterDropdown" onchange="renderItems()" class="bg-gray-700 text-sm text-gray-200 rounded px-2 py-1 outline-none border border-gray-600">
            <option value="All">All Categories</option>
            <option value="Documents">Documents</option>
            <option value="Subscriptions">Subscriptions</option>
            <option value="Household">Household</option>
        </select>
    </header>

    <!-- Main App Container Layout -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div id="installBanner" class="hidden bg-teal-600 border border-teal-500 rounded-xl p-4 shadow-md flex justify-between items-center text-white">
            <div>
                <h3 class="font-bold text-sm">Install KeepTrack App</h3>
                <p class="text-xs opacity-90">Add to your home screen for quick daily alerts!</p>
            </div>
            <button id="installBtn" class="bg-gray-900 text-teal-400 font-bold px-3 py-1.5 rounded-lg text-xs tracking-wide shadow active:scale-95 transition-transform">INSTALL</button>
        </div>

        <div id="notifBanner" class="bg-gray-800 border border-gray-700 rounded-xl p-3 flex justify-between items-center">
            <p class="text-xs text-gray-300">🔔 Enable system expiry alerts?</p>
            <button onclick="requestNotificationPermission()" class="bg-teal-500 text-white font-semibold px-3 py-1 rounded text-xs hover:bg-teal-400 transition-colors">Enable</button>
        </div>
        
        <div class="bg-gradient-to-r from-teal-900 to-emerald-900 border border-teal-700 rounded-xl p-4 shadow-md">
            <p class="text-xs text-teal-300 uppercase font-semibold tracking-wider">Quick Status</p>
            <h2 id="summaryText" class="text-lg font-bold text-white mt-1">Loading trackers...</h2>
        </div>

        <div id="itemsContainer" class="space-y-3"></div>
    </main>

    <!-- Floating Action Trigger -->
    <button onclick="toggleModal(true)" class="fixed bottom-24 right-6 bg-teal-500 hover:bg-teal-400 text-white rounded-full p-4 shadow-2xl flex items-center justify-center transition-transform transform active:scale-95 z-20">
        <svg xmlns="http://w3.org" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- Production Locked AdMob Bottom Banner Integration -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 py-1 flex justify-center z-10 shadow-xl">
        <ins class="adsbygoogle"
             style="display:inline-block;width:320px;height:50px"
             data-ad-client="ca-pub-9166716916667357"
             data-ad-slot="2623085447"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- Input Form Modal -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-70 z-30 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-sm p-6 space-y-4 relative">
            <h3 class="text-lg font-bold text-teal-400">Add New Reminder</h3>
            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-medium">Item Name</label>
                    <input type="text" id="itemName" required placeholder="e.g., Car Insurance, Netflix" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-medium">Category</label>
                    <select id="itemCategory" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none text-sm">
                        <option value="Documents">📄 Documents (Insurance, DL, Passport)</option>
                        <option value="Subscriptions">💳 Subscriptions (OTT, Gym)</option>
                        <option value="Household">🏠 Household (Gas, Meds, Filters)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-medium">Expiry Date</label>
                    <input type="date" id="itemDate" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none text-sm">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="toggleModal(false)" class="w-1/2 bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium py-2 rounded-lg text-sm transition-colors">Cancel</button>
                    <button type="submit" class="w-1/2 bg-teal-500 hover:bg-teal-400 text-white font-medium py-2 rounded-lg text-sm transition-colors">Save Alarm</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core App Application Logic -->
    <script>
        let trackList = JSON.parse(localStorage.getItem('keepTrackItems')) || [
            { id: 1, name: 'Car Insurance Renewal', category: 'Documents', date: '2026-09-15' },
            { id: 2, name: 'Netflix Premium', category: 'Subscriptions', date: '2026-08-28' }
        ];

        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function saveItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                date: document.getElementById('itemDate').value
            };
            trackList.push(newItem);
            localStorage.setItem('keepTrackItems', JSON.stringify(trackList));
            document.getElementById('itemForm').reset();
            toggleModal(false);
            renderItems();
        }

        function getDaysLeft(d) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const expiry = new Date(d);
            expiry.setHours(0,0,0,0);
            return Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
        }

        function deleteItem(id) {
            trackList = trackList.filter(item => item.id !== id);
            localStorage.setItem('keepTrackItems', JSON.stringify(trackList));
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            const selectedFilter = document.getElementById('filterDropdown').value;
            container.innerHTML = '';
            let urgentCount = 0;
            const filteredList = trackList.filter(item => selectedFilter === 'All' || item.category === selectedFilter);
            filteredList.sort((a, b) => new Date(a.date) - new Date(b.date));

            filteredList.forEach(item => {
                const daysLeft = getDaysLeft(item.date);
                if (daysLeft <= 7 && daysLeft >= 0) urgentCount++;
                let statusColor = "border-gray-700 bg-gray-800";
                let badgeColor = "bg-gray-700 text-gray-300";
                let daysText = `${daysLeft} days left`;

                if (daysLeft < 0) {
                    statusColor = "border-red-900 bg-red-950 bg-opacity-30";
                    badgeColor = "bg-red-500 text-white";
                    daysText = "Expired";
                } else if (daysLeft <= 5) {
                    statusColor = "border-orange-700 bg-orange-950 bg-opacity-20";
                    badgeColor = "bg-orange-500 text-white";
                }

                let monetizationButton = "";
                if (item.category === "Documents" && daysLeft <= 30) {
                    monetizationButton = `<a href="upi://pay?pa=9121069442@ybl&pn=KeepTrack&am=49&cu=INR&tn=Document" class="mt-2 block text-center text-xs font-bold bg-emerald-500 text-gray-950 py-1.5 rounded-lg">⚡ Get Renewal Assistance for ₹49</a>`;
